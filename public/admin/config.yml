# Decap CMS configuration — Sunshine Tiny Houses
# OAuth backend is a Cloudflare Worker (see CLAUDE.md for setup)
backend:
  name: github
  repo: MayHem777/STH-Website
  branch: main
  base_url: https://sth-oauth.mitchjcroft.workers.dev

site_url: https://sth-website.pages.dev
display_url: https://sth-website.pages.dev

media_folder: public/assets/uploads
public_folder: /assets/uploads

# Show preview link in editor (requires Cloudflare Pages preview URL or live site)
publish_mode: editorial_workflow

collections:

  # ─── THOW Products ──────────────────────────────────────────────
  - name: products-thow
    label: "THOW Models"
    label_singular: "THOW Model"
    folder: src/content/products-thow
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: title, widget: string }
      - { label: "Tagline", name: tagline, widget: string, required: false }
      - { label: "Description (SEO)", name: description, widget: text }
      - { label: "Hidden (draft)", name: draft, widget: boolean, default: true, hint: "ON = hidden from the website. Turn OFF to publish." }
      - { label: "Sort Order", name: order, widget: number, default: 99 }
      - { label: "Hero Image", name: heroImage, widget: image, required: false }
      - { label: "Hero Image Alt Text", name: heroImageAlt, widget: string, required: false }
      - { label: "Badge (e.g. Most Popular)", name: badge, widget: string, required: false }
      - label: "Specifications"
        name: specs
        widget: object
        required: false
        fields:
          # Every spec the tiny house pages use: a field missing here is DELETED when the page is saved in the CMS
          - { label: "Length", name: "Length", widget: string, required: false }
          - { label: "Width", name: "Width", widget: string, required: false }
          - { label: "Sleeps", name: "Sleeps", widget: string, required: false }
          - { label: "Bedroom", name: "Bedroom", widget: string, required: false }
          - { label: "Lock-Up from", name: "Lock-Up from", widget: string, required: false }
          - { label: "Turn Key from", name: "Turn Key from", widget: string, required: false }
          - { label: "Trailer", name: "Trailer", widget: string, required: false }
          - { label: "Registration", name: "Registration", widget: string, required: false }
      - label: "Features (bullet list)"
        name: features
        widget: list
        required: false
        field: { label: Feature, name: feature, widget: string }
      - { label: "Page Body", name: body, widget: markdown }

  # ─── Modular Products ───────────────────────────────────────────
  - name: products-modular
    label: "Modular Models"
    label_singular: "Modular Model"
    folder: src/content/products-modular
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: title, widget: string }
      - { label: "Tagline", name: tagline, widget: string, required: false }
      - { label: "Description (SEO)", name: description, widget: text }
      - { label: "Hidden (draft)", name: draft, widget: boolean, default: true, hint: "ON = hidden from the website. Turn OFF to publish." }
      - { label: "Sort Order", name: order, widget: number, default: 99 }
      - { label: "Bedrooms", name: bedrooms, widget: number, required: false, hint: "Set this to group the model under a '1 Bedroom' / '2 Bedroom' etc. listing page instead of showing it as its own standalone card." }
      - { label: "Range", name: range, widget: string, required: false, hint: "Only for models in a range with its own listing page: 'cabin' puts the model on the Cabins page (/modular-homes/cabin/)." }
      - { label: "No kitchen", name: noKitchen, widget: boolean, required: false, hint: "ON for models without a kitchen (Ensuite, Office, Raglan): hides kitchen appliances in the inclusions table." }
      - { label: "Hero Image", name: heroImage, widget: image, required: false }
      - { label: "Hero Image Alt Text", name: heroImageAlt, widget: string, required: false }
      - { label: "Price From (whole dollars, incl. GST, ex factory)", name: priceFrom, widget: number, value_type: int, required: false, hint: "e.g. 165000. Shown as 'From $165,000' on the model page, listing cards and homepage." }
      - { label: "Floor Area", name: area, widget: string, required: false, hint: "e.g. 35 m²" }
      - { label: "Size", name: size, widget: string, required: false, hint: "e.g. 10 × 3.5 m" }
      - { label: "Optional Upgrades", name: upgrades, widget: string, required: false }
      - label: "Floor Plans"
        name: floorPlans
        widget: list
        required: false
        fields:
          - { label: "Image", name: src, widget: image }
          - { label: "Caption", name: label, widget: string, required: false }
      - label: "Gallery"
        name: gallery
        widget: list
        required: false
        fields:
          - { label: "Image", name: src, widget: image }
          - { label: "Alt Text", name: alt, widget: string }
      - label: "Models on this page"
        name: models
        widget: list
        required: false
        hint: "Only for a page that covers several models on one page (none do now: Cabin models have their own pages)."
        fields:
          - { label: "Name", name: name, widget: string }
          - { label: "Description", name: blurb, widget: text }
          - { label: "Price From", name: priceFrom, widget: number, value_type: int, required: false }
          - { label: "Floor Area", name: area, widget: string, required: false }
          - { label: "Size", name: size, widget: string, required: false }
          - { label: "Optional Upgrades", name: upgrades, widget: string, required: false }
          - { label: "Image", name: image, widget: image, required: false }
          - { label: "Image Alt Text", name: imageAlt, widget: string, required: false }
          - { label: "Floor Plan", name: floorPlan, widget: image, required: false }
      - { label: "Features", name: features, widget: list, required: false }
      - label: "Specifications"
        name: specs
        widget: object
        required: false
        fields:
          - { label: "Bedrooms", name: Bedrooms, widget: string, required: false }
          - { label: "Bathrooms", name: Bathrooms, widget: string, required: false }
          - { label: "Size", name: Size, widget: string, required: false }
          - { label: "Floor area", name: "Floor area", widget: string, required: false }
          - { label: "Installation", name: Installation, widget: string, required: false }
          - { label: "Class", name: Class, widget: string, required: false }
          - { label: "Builder Licence", name: Builder, widget: string, required: false }
      - { label: "Page Body", name: body, widget: markdown }

  # ─── Class 10a Products ─────────────────────────────────────────
  - name: products-class10a
    label: "Backyard Studios"
    label_singular: "Backyard Studio"
    folder: src/content/products-class10a
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: title, widget: string }
      - { label: "Tagline", name: tagline, widget: string, required: false }
      - { label: "Description (SEO)", name: description, widget: text }
      - { label: "Hidden (draft)", name: draft, widget: boolean, default: true, hint: "ON = hidden from the website. Turn OFF to publish." }
      - { label: "Sort Order", name: order, widget: number, default: 99 }
      - { label: "Hero Image", name: heroImage, widget: image, required: false }
      - { label: "Hero Image Alt Text", name: heroImageAlt, widget: string, required: false }
      - { label: "Page Body", name: body, widget: markdown }

  # ─── Blog ────────────────────────────────────────────────────────
  - name: blog
    label: "Blog Posts"
    label_singular: "Blog Post"
    folder: src/content/blog
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: title, widget: string }
      - { label: "Short title for Google (optional)", name: seoTitle, widget: string, required: false, hint: "About 45 characters. Shown in the browser tab and Google results; the page heading still uses Title." }
      - { label: "Description (SEO)", name: description, widget: text }
      - { label: "Publish Date", name: publishDate, widget: datetime }
      - { label: "Updated Date", name: updatedDate, widget: datetime, required: false, hint: "Only set this if you've made a meaningful update after the original publish date." }
      - { label: "Draft (unpublished)", name: draft, widget: boolean, default: true, hint: "Uncheck to publish." }
      - { label: "Author", name: author, widget: string, default: "Sunshine Tiny Houses" }
      - { label: "Hero Image", name: heroImage, widget: image, required: false }
      - { label: "Hero Image Alt Text", name: heroImageAlt, widget: string, required: false }
      - { label: "Social Share Image (OG Image)", name: ogImage, widget: image, required: false, hint: "Optional — falls back to Hero Image if left blank." }
      - { label: "Body", name: body, widget: markdown }

  # ─── Static Pages ────────────────────────────────────────────────
  - name: pages
    label: "Pages"
    label_singular: "Page"
    folder: src/content/pages
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: title, widget: string }
      - { label: "Description (SEO)", name: description, widget: text }
      - { label: "Hidden (draft)", name: draft, widget: boolean, default: true, hint: "ON = hidden from the website. Turn OFF to publish." }
      - { label: "Body", name: body, widget: markdown }
